name: image

# Builds ghcr.io/<owner>/pi4normies:latest. Rebuilt daily so new codespaces
# start with a recent pi (post-create updates it anyway if the schedule lapses).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - config/**
      - extensions/**
      - scripts/**
      - .github/workflows/image.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: the point of the daily build is to pick up
      # the latest pi, Chrome and system packages.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          no-cache: true
          pull: true
          tags: pi4normies:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=pi coding agent set up for non-technical users in GitHub Codespaces

      # Start pi in RPC mode the way a codespace would and check that it comes
      # up with the bundled extensions loaded and the default model selected.
      # A failing extension makes pi exit non-zero before answering.
      - name: Smoke test
        run: |
          set -o pipefail
          out=$( (echo '{"type":"get_state"}'; sleep 15) \
            | docker run --rm -i -e OPENROUTER_API_KEY=dummy pi4normies:test \
                timeout 60 pi --mode rpc --no-session )
          echo "$out" | head -c 2000; echo
          echo "$out" | grep -q '"success":true'
          echo "$out" | grep -q '"id":"anthropic/claude-opus-5.5"'
          docker run --rm pi4normies:test bash -c \
            'google-chrome-stable --version && ffmpeg -version | head -1 && python3 --version && pi --version'

      - name: Push
        run: |
          docker tag pi4normies:test ${{ steps.name.outputs.image }}:latest
          docker push ${{ steps.name.outputs.image }}:latest
